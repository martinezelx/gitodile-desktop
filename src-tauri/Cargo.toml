[package]
name = "gitodrile"
version = "0.1.0"
description = "A friendly Git desktop client"
authors = ["Luis M. Martínez"]
edition = "2021"

[lib]
name = "gitodrile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Smaller binary loads (and pages in from disk) faster on launch; this app is
# I/O-bound (spawning git, not number-crunching), so trading opt-level 3 for
# "s" costs nothing noticeable at runtime. See https://v2.tauri.app/concept/size/.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
