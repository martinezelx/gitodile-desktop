[package]
name = "gitodile"
version = "0.2.0-preview.12"
description = "A friendly Git desktop client"
authors = ["Luis M. Martínez"]
edition = "2021"
license = "AGPL-3.0-only"

[lib]
name = "gitodile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-updater = "=2.11.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "sync", "time"] }
# The exact updater plugin owns the only HTTP client. This direct dependency is
# type-level only: it lets GitOdile retain the plugin client's redirect/timeout
# policy and classify its errors without selecting a second TLS provider.
reqwest = { version = "0.13", default-features = false }
time = { version = "0.3", features = ["formatting"] }
# Filesystem watching for live working-tree updates (task 020). Default
# features off: only the platform backends are wanted, not `serde` (events are
# never serialized — the frontend gets a single coalesced signal, not raw
# events) and not the alternative channel crates. `notify-debouncer-full` is
# deliberately not used; the trailing debounce this needs is a few lines in
# the watcher thread and does not justify a second dependency in a binary
# whose size task 018 worked to reduce.
notify = { version = "8.2.0", default-features = false, features = ["macos_fsevent"] }

# The NSIS installer registers its install location under HKCU or HKLM; the
# hive, not the directory, says whether an installation is per-user. Already in
# the tree through the updater plugin's HTTP client on Windows.
[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"

[dev-dependencies]
# Repository-owned module-direction guard from ADR 0003. Development-only;
# production artifacts keep no parser dependency.
syn = { version = "3", features = ["full"] }
base64 = "0.23"
minisign-verify = "0.2"

# Smaller binary loads (and pages in from disk) faster on launch; this app is
# I/O-bound (spawning git, not number-crunching), so trading opt-level 3 for
# "s" costs nothing noticeable at runtime. See https://v2.tauri.app/concept/size/.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
