name: Private candidate signing

on:
  workflow_run:
    workflows: ["Private signed-build candidate"]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: private-signing-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  authorize:
    name: Re-authorize source and complete matrix
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      version: ${{ steps.identity.outputs.version }}
      profile: ${{ steps.identity.outputs.profile }}
      sha: ${{ steps.identity.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          name: candidate-identity
          path: authorization
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          pattern: unsigned-*
          path: authorization/unsigned
      - name: Read candidate identity
        id: identity
        run: |
          node -e "const c=require('./authorization/candidate.json'); const fs=require('fs'); fs.appendFileSync(process.env.GITHUB_OUTPUT,'tag='+c.source.tag+'\nversion='+c.release.version+'\nprofile='+c.release.signingProfile+'\nsha='+c.source.sha+'\n')"
      - name: Fetch exact tag and approved main boundary
        env:
          RELEASE_TAG: ${{ steps.identity.outputs.tag }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git fetch --no-tags origin "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
      - name: Revalidate metadata directly from the tagged object
        env:
          RELEASE_TAG: ${{ steps.identity.outputs.tag }}
          SOURCE_SHA: ${{ steps.identity.outputs.sha }}
        run: >-
          node scripts/release/release-candidate.mjs
          --event coordinator_dispatch
          --ref-type tag
          --tag "$RELEASE_TAG"
          --sha "$SOURCE_SHA"
          --main-ref refs/remotes/origin/main
          --metadata-revision "$SOURCE_SHA"
          --require-head false
          --output authorization/authorized-candidate.json
      - name: Require byte-identical authorization identity
        run: node -e "const fs=require('fs'); const a=JSON.parse(fs.readFileSync('authorization/candidate.json')); const b=JSON.parse(fs.readFileSync('authorization/authorized-candidate.json')); if(JSON.stringify(a)!==JSON.stringify(b)) process.exit(1)"
      - name: Rehash every package and require all targets
        run: node scripts/release/release-evidence.mjs verify-matrix --candidate authorization/candidate.json --directory authorization/unsigned --phase unsigned

  windows-deferred-boundary:
    name: Record deferred Windows Authenticode boundary
    needs: authorize
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          name: candidate-identity
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          name: unsigned-windows-x86_64
          path: input
      - name: Rehash and retain explicitly OS-untrusted Windows bytes
        shell: pwsh
        run: |
          node scripts/release/release-evidence.mjs verify-artifacts --evidence input/evidence.json --directory input
          $evidence = Get-Content -Raw input/evidence.json | ConvertFrom-Json
          $source = Join-Path input $evidence.artifacts[0].fileName
          New-Item -ItemType Directory -Path os-signed/windows-x86_64 | Out-Null
          $destination = Join-Path os-signed/windows-x86_64 $evidence.artifacts[0].fileName
          Copy-Item -LiteralPath $source -Destination $destination
          node scripts/release/make-os-trust.mjs windows-x86_64 authenticode-deferred windows-trust.json
          node scripts/release/release-evidence.mjs create --candidate candidate.json --target windows-x86_64 --phase os-signed --trust windows-trust.json --artifact "first-install-and-updater=$destination" --output os-signed/windows-x86_64/evidence.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: os-signed-windows-x86_64
          path: os-signed/windows-x86_64
          if-no-files-found: error
          retention-days: 30

  linux-os-boundary:
    name: Record Linux OS-trust boundary
    needs: authorize
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          name: candidate-identity
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          name: unsigned-linux-x86_64
          path: input
      - name: Rehash and retain AppImage final bytes
        run: |
          node scripts/release/release-evidence.mjs verify-artifacts --evidence input/evidence.json --directory input
          mkdir -p os-signed/linux-x86_64
          package="$(node -e "const e=require('./input/evidence.json'); process.stdout.write(e.artifacts[0].fileName)")"
          cp "input/$package" "os-signed/linux-x86_64/$package"
          node scripts/release/make-os-trust.mjs linux-x86_64 not-applicable linux-trust.json
          node scripts/release/release-evidence.mjs create --candidate candidate.json --target linux-x86_64 --phase os-signed --trust linux-trust.json --artifact "first-install-and-updater=os-signed/linux-x86_64/$package" --output os-signed/linux-x86_64/evidence.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: os-signed-linux-x86_64
          path: os-signed/linux-x86_64
          if-no-files-found: error
          retention-days: 30

  updater-sign-and-gate:
    name: Updater-sign final bytes and close matrix
    needs: [authorize, windows-deferred-boundary, linux-os-boundary]
    if: >-
      always() &&
      needs.authorize.result == 'success' &&
      needs.linux-os-boundary.result == 'success' &&
      needs.windows-deferred-boundary.result == 'success'
    runs-on: ubuntu-24.04
    environment: ${{ needs.authorize.outputs.profile == 'validation' && 'validation-updater-signing' || 'production-updater-signing' }}
    env:
      GITODILE_UPDATE_PROFILE: ${{ needs.authorize.outputs.profile }}
      GITODILE_UPDATER_PUBLIC_KEY: ${{ needs.authorize.outputs.profile == 'validation' && vars.GITODILE_VALIDATION_UPDATER_PUBLIC_KEY || vars.GITODILE_PRODUCTION_UPDATER_PUBLIC_KEY }}
      GITODILE_UPDATER_PUBLIC_KEY_ID: ${{ needs.authorize.outputs.profile == 'validation' && vars.GITODILE_VALIDATION_UPDATER_PUBLIC_KEY_ID || vars.GITODILE_PRODUCTION_UPDATER_PUBLIC_KEY_ID }}
      GITODILE_VALIDATION_UPDATER_PUBLIC_KEY: ${{ vars.GITODILE_VALIDATION_UPDATER_PUBLIC_KEY }}
      GITODILE_VALIDATION_UPDATER_PUBLIC_KEY_ID: ${{ vars.GITODILE_VALIDATION_UPDATER_PUBLIC_KEY_ID }}
      GITODILE_PRODUCTION_UPDATER_PUBLIC_KEY: ${{ vars.GITODILE_PRODUCTION_UPDATER_PUBLIC_KEY }}
      GITODILE_PRODUCTION_UPDATER_PUBLIC_KEY_ID: ${{ vars.GITODILE_PRODUCTION_UPDATER_PUBLIC_KEY_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          name: candidate-identity
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: os-signed-*
          path: os
      - name: Rehash and require every OS-stage target
        run: node scripts/release/release-evidence.mjs verify-matrix --candidate candidate.json --directory os --phase os-signed
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.17.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Install Linux verifier dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install trusted locked signing verifier
        run: pnpm install --frozen-lockfile
      - name: Require updater credentials without printing values
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/release/release-evidence.mjs check-credentials --credential TAURI_SIGNING_PRIVATE_KEY --credential TAURI_SIGNING_PRIVATE_KEY_PASSWORD
      - name: Sign final bytes and verify every updater signature
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$GITODILE_UPDATER_PUBLIC_KEY" && test -n "$GITODILE_UPDATER_PUBLIC_KEY_ID"
          test -n "$GITODILE_VALIDATION_UPDATER_PUBLIC_KEY" && test -n "$GITODILE_VALIDATION_UPDATER_PUBLIC_KEY_ID"
          test -n "$GITODILE_PRODUCTION_UPDATER_PUBLIC_KEY" && test -n "$GITODILE_PRODUCTION_UPDATER_PUBLIC_KEY_ID"
          test "$GITODILE_VALIDATION_UPDATER_PUBLIC_KEY" != "$GITODILE_PRODUCTION_UPDATER_PUBLIC_KEY"
          test "$GITODILE_VALIDATION_UPDATER_PUBLIC_KEY_ID" != "$GITODILE_PRODUCTION_UPDATER_PUBLIC_KEY_ID"
          if [[ "$GITODILE_UPDATE_PROFILE" == validation ]]; then
            test "$GITODILE_UPDATER_PUBLIC_KEY" = "$GITODILE_VALIDATION_UPDATER_PUBLIC_KEY"
            test "$GITODILE_UPDATER_PUBLIC_KEY_ID" = "$GITODILE_VALIDATION_UPDATER_PUBLIC_KEY_ID"
          else
            test "$GITODILE_UPDATER_PUBLIC_KEY" = "$GITODILE_PRODUCTION_UPDATER_PUBLIC_KEY"
            test "$GITODILE_UPDATER_PUBLIC_KEY_ID" = "$GITODILE_PRODUCTION_UPDATER_PUBLIC_KEY_ID"
          fi
          public_key_file="$RUNNER_TEMP/gitodile-updater-public-key"
          trap 'rm -f "$public_key_file"' EXIT
          printf '%s' "$GITODILE_UPDATER_PUBLIC_KEY" > "$public_key_file"
          cargo build --locked --manifest-path src-tauri/Cargo.toml --example verify_updater_signature
          while IFS= read -r -d '' evidence; do
            directory="$(dirname "$evidence")"
            updater="$(node -e "const fs=require('node:fs'); const e=JSON.parse(fs.readFileSync(process.argv[1],'utf8')); const a=e.artifacts.find(x=>x.role==='updater'||x.role==='first-install-and-updater'); if(!a)process.exit(1); process.stdout.write(a.fileName)" "$evidence")"
            pnpm tauri signer sign "$directory/$updater"
            src-tauri/target/debug/examples/verify_updater_signature "$directory/$updater" "$directory/$updater.sig" "$public_key_file"
          done < <(find os -name evidence.json -type f -print0)
          node scripts/release/finalize-signed-evidence.mjs candidate.json os signed "$GITODILE_UPDATER_PUBLIC_KEY_ID"
          node scripts/release/release-evidence.mjs verify-matrix --candidate candidate.json --directory signed --phase signed
      - name: Write private matrix authorization record
        run: node -e "const fs=require('fs'); const c=require('./candidate.json'); fs.writeFileSync('signed/matrix.json', JSON.stringify({schemaVersion:1,source:c.source,release:c.release,targets:c.matrix.requiredTargets,result:'passed',publicPromotionAllowed:false},null,2)+'\n',{flag:'wx'})"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: private-signed-${{ needs.authorize.outputs.tag }}
          path: signed
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: false
