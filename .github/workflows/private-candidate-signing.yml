name: Private candidate signing

on:
  workflow_run:
    workflows: ["Private signed-build candidate"]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: private-signing-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  authorize:
    name: Re-authorize source and complete matrix
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      version: ${{ steps.identity.outputs.version }}
      profile: ${{ steps.identity.outputs.profile }}
      sha: ${{ steps.identity.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          name: candidate-identity
          path: authorization
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          pattern: unsigned-*
          path: authorization/unsigned
      - name: Read candidate identity
        id: identity
        run: |
          node -e "const c=require('./authorization/candidate.json'); const fs=require('fs'); if(c.source.sha!==process.env.HEAD_SHA) process.exit(1); fs.appendFileSync(process.env.GITHUB_OUTPUT,'tag='+c.source.tag+'\nversion='+c.release.version+'\nprofile='+c.release.signingProfile+'\nsha='+c.source.sha+'\n')"
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      - name: Fetch exact tag and approved main boundary
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git fetch --no-tags origin "+refs/tags/${{ steps.identity.outputs.tag }}:refs/tags/${{ steps.identity.outputs.tag }}"
      - name: Revalidate metadata directly from the tagged object
        run: >-
          node scripts/release/release-candidate.mjs
          --event push
          --tag "${{ steps.identity.outputs.tag }}"
          --sha "${{ steps.identity.outputs.sha }}"
          --main-ref refs/remotes/origin/main
          --metadata-revision "${{ steps.identity.outputs.sha }}"
          --require-head false
          --output authorization/authorized-candidate.json
      - name: Require byte-identical authorization identity
        run: node -e "const fs=require('fs'); const a=JSON.parse(fs.readFileSync('authorization/candidate.json')); const b=JSON.parse(fs.readFileSync('authorization/authorized-candidate.json')); if(JSON.stringify(a)!==JSON.stringify(b)) process.exit(1)"
      - name: Rehash every package and require all targets
        run: node scripts/release/release-evidence.mjs verify-matrix --candidate authorization/candidate.json --directory authorization/unsigned --phase unsigned

  windows-os-sign:
    name: Authenticode sign Windows
    needs: authorize
    runs-on: windows-2025
    environment: production-windows-signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          name: candidate-identity
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          name: unsigned-windows-x86_64
          path: input
      - name: Rehash staged Windows package
        run: node scripts/release/release-evidence.mjs verify-artifacts --evidence input/evidence.json --directory input
      - name: Require Windows credentials without printing values
        env:
          GITODILE_WINDOWS_CERTIFICATE_BASE64: ${{ secrets.GITODILE_WINDOWS_CERTIFICATE_BASE64 }}
          GITODILE_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.GITODILE_WINDOWS_CERTIFICATE_PASSWORD }}
        run: node scripts/release/release-evidence.mjs check-credentials --credential GITODILE_WINDOWS_CERTIFICATE_BASE64 --credential GITODILE_WINDOWS_CERTIFICATE_PASSWORD
      - name: Sign and independently verify Authenticode
        shell: pwsh
        env:
          GITODILE_WINDOWS_CERTIFICATE_BASE64: ${{ secrets.GITODILE_WINDOWS_CERTIFICATE_BASE64 }}
          GITODILE_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.GITODILE_WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $evidence = Get-Content -Raw input/evidence.json | ConvertFrom-Json
          $source = Join-Path input $evidence.artifacts[0].fileName
          New-Item -ItemType Directory -Path os-signed/windows-x86_64 | Out-Null
          $destination = Join-Path os-signed/windows-x86_64 $evidence.artifacts[0].fileName
          ./scripts/release/sign-windows.ps1 -InputFile $source -OutputFile $destination -IdentityOutput windows-identity.json
      - name: Record public signer identity and final-byte hash
        shell: pwsh
        run: |
          node scripts/release/make-os-trust.mjs windows-x86_64 windows-identity.json windows-trust.json
          $package = Get-ChildItem os-signed/windows-x86_64 -Filter *.exe -File
          if ($package.Count -ne 1) { throw "Expected one signed NSIS package" }
          node scripts/release/release-evidence.mjs create --candidate candidate.json --target windows-x86_64 --phase os-signed --trust windows-trust.json --artifact "first-install-and-updater=$($package.FullName)" --output os-signed/windows-x86_64/evidence.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: os-signed-windows-x86_64
          path: os-signed/windows-x86_64
          if-no-files-found: error
          retention-days: 30

  macos-os-sign:
    name: Sign and notarize ${{ matrix.target }}
    needs: authorize
    strategy:
      fail-fast: false
      matrix:
        target: [darwin-aarch64, darwin-x86_64]
    runs-on: macos-15
    environment: production-macos-signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          name: candidate-identity
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          name: unsigned-${{ matrix.target }}
          path: input
      - name: Rehash staged macOS bundle
        run: node scripts/release/release-evidence.mjs verify-artifacts --evidence input/evidence.json --directory input
      - name: Require Apple credentials without printing values
        env:
          GITODILE_MACOS_CERTIFICATE_BASE64: ${{ secrets.GITODILE_MACOS_CERTIFICATE_BASE64 }}
          GITODILE_MACOS_CERTIFICATE_PASSWORD: ${{ secrets.GITODILE_MACOS_CERTIFICATE_PASSWORD }}
          GITODILE_APPLE_SIGNING_IDENTITY: ${{ secrets.GITODILE_APPLE_SIGNING_IDENTITY }}
          GITODILE_APPLE_ID: ${{ secrets.GITODILE_APPLE_ID }}
          GITODILE_APPLE_PASSWORD: ${{ secrets.GITODILE_APPLE_PASSWORD }}
          GITODILE_APPLE_TEAM_ID: ${{ secrets.GITODILE_APPLE_TEAM_ID }}
        run: >-
          node scripts/release/release-evidence.mjs check-credentials
          --credential GITODILE_MACOS_CERTIFICATE_BASE64
          --credential GITODILE_MACOS_CERTIFICATE_PASSWORD
          --credential GITODILE_APPLE_SIGNING_IDENTITY
          --credential GITODILE_APPLE_ID
          --credential GITODILE_APPLE_PASSWORD
          --credential GITODILE_APPLE_TEAM_ID
      - name: Sign, notarize, staple and verify
        env:
          GITODILE_MACOS_CERTIFICATE_BASE64: ${{ secrets.GITODILE_MACOS_CERTIFICATE_BASE64 }}
          GITODILE_MACOS_CERTIFICATE_PASSWORD: ${{ secrets.GITODILE_MACOS_CERTIFICATE_PASSWORD }}
          GITODILE_APPLE_SIGNING_IDENTITY: ${{ secrets.GITODILE_APPLE_SIGNING_IDENTITY }}
          GITODILE_APPLE_ID: ${{ secrets.GITODILE_APPLE_ID }}
          GITODILE_APPLE_PASSWORD: ${{ secrets.GITODILE_APPLE_PASSWORD }}
          GITODILE_APPLE_TEAM_ID: ${{ secrets.GITODILE_APPLE_TEAM_ID }}
        run: |
          package="$(node -e "const e=require('./input/evidence.json'); process.stdout.write(e.artifacts[0].fileName)")"
          bash scripts/release/sign-notarize-macos.sh "input/$package" "os-signed/${{ matrix.target }}" "${{ needs.authorize.outputs.version }}" "${{ matrix.target }}" macos-identity.json
      - name: Record public signer/notary identity and final-byte hashes
        run: |
          node scripts/release/make-os-trust.mjs "${{ matrix.target }}" macos-identity.json macos-trust.json
          dmg="$(find "os-signed/${{ matrix.target }}" -maxdepth 1 -name '*.dmg' -type f)"
          updater="$(find "os-signed/${{ matrix.target }}" -maxdepth 1 -name '*.app.tar.gz' -type f)"
          test -n "$dmg" && test -n "$updater"
          node scripts/release/release-evidence.mjs create --candidate candidate.json --target "${{ matrix.target }}" --phase os-signed --trust macos-trust.json --artifact "first-install=$dmg" --artifact "updater=$updater" --output "os-signed/${{ matrix.target }}/evidence.json"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: os-signed-${{ matrix.target }}
          path: os-signed/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 30

  linux-os-boundary:
    name: Record Linux OS-trust boundary
    needs: authorize
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          name: candidate-identity
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          name: unsigned-linux-x86_64
          path: input
      - name: Rehash and retain AppImage final bytes
        run: |
          node scripts/release/release-evidence.mjs verify-artifacts --evidence input/evidence.json --directory input
          mkdir -p os-signed/linux-x86_64
          package="$(node -e "const e=require('./input/evidence.json'); process.stdout.write(e.artifacts[0].fileName)")"
          cp "input/$package" "os-signed/linux-x86_64/$package"
          node scripts/release/make-os-trust.mjs linux-x86_64 not-applicable linux-trust.json
          node scripts/release/release-evidence.mjs create --candidate candidate.json --target linux-x86_64 --phase os-signed --trust linux-trust.json --artifact "first-install-and-updater=os-signed/linux-x86_64/$package" --output os-signed/linux-x86_64/evidence.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: os-signed-linux-x86_64
          path: os-signed/linux-x86_64
          if-no-files-found: error
          retention-days: 30

  updater-sign-and-gate:
    name: Updater-sign final bytes and close matrix
    needs: [authorize, windows-os-sign, macos-os-sign, linux-os-boundary]
    runs-on: ubuntu-24.04
    environment: ${{ needs.authorize.outputs.profile == 'validation' && 'validation-updater-signing' || 'production-updater-signing' }}
    env:
      GITODILE_UPDATER_PUBLIC_KEY: ${{ needs.authorize.outputs.profile == 'validation' && vars.GITODILE_VALIDATION_UPDATER_PUBLIC_KEY || vars.GITODILE_PRODUCTION_UPDATER_PUBLIC_KEY }}
      GITODILE_UPDATER_PUBLIC_KEY_ID: ${{ needs.authorize.outputs.profile == 'validation' && vars.GITODILE_VALIDATION_UPDATER_PUBLIC_KEY_ID || vars.GITODILE_PRODUCTION_UPDATER_PUBLIC_KEY_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          name: candidate-identity
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: os-signed-*
          path: os
      - name: Rehash and require every OS-stage target
        run: node scripts/release/release-evidence.mjs verify-matrix --candidate candidate.json --directory os --phase os-signed
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 11.17.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Install trusted locked signing verifier
        run: pnpm install --frozen-lockfile
      - name: Require updater credentials without printing values
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/release/release-evidence.mjs check-credentials --credential TAURI_SIGNING_PRIVATE_KEY --credential TAURI_SIGNING_PRIVATE_KEY_PASSWORD
      - name: Sign final bytes and verify every updater signature
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$GITODILE_UPDATER_PUBLIC_KEY" && test -n "$GITODILE_UPDATER_PUBLIC_KEY_ID"
          public_key_file="$RUNNER_TEMP/gitodile-updater-public-key"
          trap 'rm -f "$public_key_file"' EXIT
          printf '%s' "$GITODILE_UPDATER_PUBLIC_KEY" > "$public_key_file"
          cargo build --manifest-path src-tauri/Cargo.toml --example verify_updater_signature
          while IFS= read -r -d '' evidence; do
            directory="$(dirname "$evidence")"
            updater="$(node -e "const e=require(process.argv[1]); const a=e.artifacts.find(x=>x.role==='updater'||x.role==='first-install-and-updater'); if(!a)process.exit(1); process.stdout.write(a.fileName)" "$evidence")"
            pnpm tauri signer sign "$directory/$updater"
            src-tauri/target/debug/examples/verify_updater_signature "$directory/$updater" "$directory/$updater.sig" "$public_key_file"
          done < <(find os -name evidence.json -type f -print0)
          node scripts/release/finalize-signed-evidence.mjs candidate.json os signed "$GITODILE_UPDATER_PUBLIC_KEY_ID"
          node scripts/release/release-evidence.mjs verify-matrix --candidate candidate.json --directory signed --phase signed
      - name: Write private matrix authorization record
        run: node -e "const fs=require('fs'); const c=require('./candidate.json'); fs.writeFileSync('signed/matrix.json', JSON.stringify({schemaVersion:1,source:c.source,release:c.release,targets:c.matrix.requiredTargets,result:'passed',publicPromotionAllowed:false},null,2)+'\n',{flag:'wx'})"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: private-signed-${{ needs.authorize.outputs.tag }}
          path: signed
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: false
