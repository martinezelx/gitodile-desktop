name: Public release publishing

on:
  workflow_run:
    workflows: ["Private candidate signing"]
    types: [completed]
  workflow_dispatch:
    inputs:
      signing_run_id:
        description: Successful Private candidate signing workflow run ID
        required: true
        type: string
      mode:
        description: Reconcile the fixed private validation draft only
        required: true
        type: choice
        options:
          - validation-draft

permissions:
  actions: read
  contents: read

concurrency:
  group: gitodile-publication
  cancel-in-progress: false

jobs:
  authorize-and-stage:
    name: Verify private evidence and stage public-only bytes
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.sha == github.workflow_sha) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'workflow_run' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.release.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Validate automatic or manual publication inputs
        env:
          AUTOMATIC: ${{ github.event_name == 'workflow_run' }}
          SIGNING_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.signing_run_id }}
          PUBLICATION_MODE: ${{ github.event_name == 'workflow_run' && 'automatic' || inputs.mode }}
        run: |
          node --input-type=module <<'NODE'
          const runId = process.env.SIGNING_RUN_ID ?? "";
          const mode = process.env.PUBLICATION_MODE ?? "";
          const automatic = process.env.AUTOMATIC === "true";
          if (!/^[1-9][0-9]*$/.test(runId)) throw new Error("Signing run ID must be a positive integer.");
          if ((automatic && mode !== "automatic") || (!automatic && mode !== "validation-draft")) {
            throw new Error("Publication mode does not match its trusted trigger.");
          }
          NODE
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          run-id: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.signing_run_id }}
          github-token: ${{ github.token }}
          pattern: private-signed-*
          path: signed
          merge-multiple: true
      - name: Validate the exact source signing workflow run
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SIGNING_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.signing_run_id }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { validateSourceRun } from "./scripts/release/github-publication.mjs";
          const response = await fetch(`https://api.github.com/repos/${process.env.SOURCE_REPOSITORY}/actions/runs/${process.env.SIGNING_RUN_ID}`, {
            headers: { Accept: "application/vnd.github+json", Authorization: `Bearer ${process.env.GITHUB_TOKEN}`, "X-GitHub-Api-Version": "2022-11-28" },
            signal: AbortSignal.timeout(15000),
          });
          if (!response.ok) throw new Error(`Signing run lookup failed with HTTP ${response.status}.`);
          const run = await response.json();
          validateSourceRun(run, process.env.SOURCE_REPOSITORY);
          fs.writeFileSync("validated-source-run.json", `${JSON.stringify({
            id: run.id,
            name: run.name,
            event: run.event,
            conclusion: run.conclusion,
            path: run.path,
            head_branch: run.head_branch,
            repository: { full_name: run.repository.full_name },
          }, null, 2)}\n`, { flag: "wx" });
          NODE
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.17.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Linux system dependencies for the full Rust gate
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Require the full repository and live feedback contracts
        run: pnpm run check:publication
      - name: Derive the immutable notes path
        id: release
        env:
          AUTOMATIC: ${{ github.event_name == 'workflow_run' }}
          REQUESTED_MODE: ${{ inputs.mode }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const matrix = JSON.parse(fs.readFileSync("signed/matrix.json", "utf8"));
          const tag = matrix.source?.tag ?? "";
          if (!/^v(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)(?:-preview\.[1-9][0-9]*)?$/.test(tag) || !fs.existsSync(`docs/release/notes/${tag}.md`)) {
            throw new Error("The signed matrix does not identify reviewed release notes.");
          }
          const automatic = process.env.AUTOMATIC === "true";
          const mode = automatic
            ? (matrix.release?.channel === "preview" && matrix.release?.githubPrerelease === true ? "preview-testing" : "production")
            : process.env.REQUESTED_MODE;
          let publishedAt = "";
          if (automatic) {
            const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/commits/${matrix.source.sha}`, {
              headers: { Accept: "application/vnd.github+json", Authorization: `Bearer ${process.env.GITHUB_TOKEN}`, "X-GitHub-Api-Version": "2022-11-28" },
              signal: AbortSignal.timeout(15000), redirect: "error",
            });
            if (!response.ok) throw new Error(`Source commit lookup failed with HTTP ${response.status}.`);
            const commit = await response.json();
            publishedAt = new Date(commit.commit.committer.date).toISOString().replace(".000Z", "Z");
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `tag=${tag}\nmode=${mode}\npublished_at=${publishedAt}\n`);
          NODE
      - name: Validate the full signed matrix and prepare public-only bytes
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          PUBLICATION_MODE: ${{ steps.release.outputs.mode }}
          PUBLISHED_AT: ${{ steps.release.outputs.published_at }}
        run: |
          args=(--signed signed --notes "docs/release/notes/$RELEASE_TAG.md" --qualification docs/release/update-target-qualifications.json --mode "$PUBLICATION_MODE" --public-file license=LICENSE --public-file third-party-notices=THIRD_PARTY_LICENSES.md --output public-bundle)
          if [[ "$PUBLICATION_MODE" != validation-draft ]]; then
            test -n "$PUBLISHED_AT"
            args+=(--published-at "$PUBLISHED_AT")
          else
            test -z "$PUBLISHED_AT"
          fi
          node scripts/release/public-release.mjs "${args[@]}"
      - name: Add reviewed publisher runtime without application source
        run: |
          mkdir -p public-bundle/runtime/scripts/release public-bundle/runtime/docs/architecture
          cp scripts/release/github-publication.mjs scripts/release/public-release.mjs scripts/release/qualification-evidence.mjs scripts/release/release-candidate.mjs scripts/release/release-evidence.mjs public-bundle/runtime/scripts/release/
          cp docs/architecture/065-9-1-app-update-contract.json public-bundle/runtime/docs/architecture/
          cp validated-source-run.json public-bundle/runtime/
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: public-publication-bundle
          path: public-bundle
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false

  publish:
    name: Serialize destination release and feeds
    needs: authorize-and-stage
    runs-on: ubuntu-24.04
    environment: ${{ needs.authorize-and-stage.outputs.mode == 'validation-draft' && 'public-release-validation-draft' || 'public-release-production' }}
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: public-publication-bundle
          path: public-bundle
      - name: Require destination-scoped credential without printing it
        env:
          GITODILE_PUBLIC_RELEASE_TOKEN: ${{ secrets.GITODILE_PUBLIC_RELEASE_TOKEN }}
        run: test -n "$GITODILE_PUBLIC_RELEASE_TOKEN"
      - name: Reconcile immutable release under the validated publication policy
        working-directory: public-bundle/runtime
        env:
          GITODILE_PUBLIC_RELEASE_TOKEN: ${{ secrets.GITODILE_PUBLIC_RELEASE_TOKEN }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: >-
          node scripts/release/github-publication.mjs
          --directory ..
          --source-repository "$SOURCE_REPOSITORY"
          --source-run validated-source-run.json
