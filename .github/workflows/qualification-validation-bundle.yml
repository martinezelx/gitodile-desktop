name: Controlled updater qualification bundle

on:
  workflow_dispatch:
    inputs:
      build_a_signing_run_id:
        description: Successful validation build A Private candidate signing run ID
        required: true
        type: string
      build_b_signing_run_id:
        description: Successful validation build B Private candidate signing run ID
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: gitodile-updater-qualification-bundle
  cancel-in-progress: false

jobs:
  prepare:
    name: Verify and package the fixed A-to-B validation pair
    if: github.ref == 'refs/heads/main' && github.sha == github.workflow_sha
    runs-on: ubuntu-24.04
    env:
      GITODILE_VALIDATION_UPDATE_FEED: ${{ vars.GITODILE_VALIDATION_UPDATE_FEED }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Verify successful private signing run identities
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BUILD_A_RUN_ID: ${{ inputs.build_a_signing_run_id }}
          BUILD_B_RUN_ID: ${{ inputs.build_b_signing_run_id }}
        run: |
          node --input-type=module <<'NODE'
          for (const id of [process.env.BUILD_A_RUN_ID, process.env.BUILD_B_RUN_ID]) {
            if (!/^[1-9][0-9]*$/.test(id ?? "")) throw new Error("Signing run IDs must be positive integers.");
            const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/actions/runs/${id}`, {
              headers: { Accept: "application/vnd.github+json", Authorization: `Bearer ${process.env.GITHUB_TOKEN}`, "X-GitHub-Api-Version": "2022-11-28" },
              signal: AbortSignal.timeout(15000),
            });
            if (!response.ok) throw new Error(`Signing run lookup failed with HTTP ${response.status}.`);
            const run = await response.json();
            if (run.name !== "Private candidate signing" || run.event !== "workflow_run" || run.conclusion !== "success" || run.repository?.full_name !== process.env.GITHUB_REPOSITORY) {
              throw new Error("A supplied run is not a successful same-repository private signing run.");
            }
          }
          NODE
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          run-id: ${{ inputs.build_a_signing_run_id }}
          github-token: ${{ github.token }}
          pattern: private-signed-*
          path: signed-a
          merge-multiple: true
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          run-id: ${{ inputs.build_b_signing_run_id }}
          github-token: ${{ github.token }}
          pattern: private-signed-*
          path: signed-b
          merge-multiple: true
      - name: Require the controlled feed identity
        run: test -n "$GITODILE_VALIDATION_UPDATE_FEED"
      - name: Verify both signed matrices and prepare non-promoting bundle
        run: >-
          node scripts/release/qualification-bundle.mjs
          --from signed-a
          --to signed-b
          --feed "$GITODILE_VALIDATION_UPDATE_FEED"
          --output qualification-bundle
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: controlled-updater-qualification-preview.4-to-preview.5
          path: qualification-bundle
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: false
