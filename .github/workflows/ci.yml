name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull-request branch supersedes the run in flight. A push to
# main never cancels: the merge coordinator waits for these exact checks on
# the merge SHA before it tags a release.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  public-feedback:
    name: Public feedback contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.17.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:feedback
        env:
          GITHUB_TOKEN: ${{ github.token }}

  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.17.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:docs
      - run: pnpm run check:frontend

  # Runner images are pinned to the same generations the release pipeline
  # uses, so CI and releases stop proving the same thing the day `-latest`
  # moves. Check names carry the platform, not the image, so a pin bump does
  # not rename a required check.
  rust:
    name: Rust checks (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
          - platform: windows
            runner: windows-2025
          - platform: macos
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 30
    steps:
      # Branch protection requires every platform's check by name, so a pull
      # request that does not touch src-tauri/ still runs the macOS job and
      # reports success; it only skips the work. Linux and Windows always run.
      # Release pull requests and every push to main run in full, because the
      # merge coordinator waits for these checks on the merge SHA.
      - name: Decide whether this run needs the full check
        id: scope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          PULL: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          ALWAYS: ${{ matrix.platform != 'macos' }}
          PATTERN: '^src-tauri/'
        run: |
          if [ "$ALWAYS" = true ] || [ "$EVENT" != pull_request ] || [[ "$HEAD_REF" == release/* ]]; then
            full=true
          else
            # Read the list first: under pipefail, `grep -q` closing the pipe
            # early would turn a match into a failure and skip the check.
            files=$(gh api "repos/$REPO/pulls/$PULL/files" --paginate --jq '.[].filename')
            if grep -Eq "$PATTERN" <<<"$files"; then full=true; else full=false; fi
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "Full check: $full"
      - if: steps.scope.outputs.full == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Linux system dependencies
        if: steps.scope.outputs.full == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - if: steps.scope.outputs.full == 'true'
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - if: steps.scope.outputs.full == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - if: steps.scope.outputs.full == 'true'
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - if: steps.scope.outputs.full == 'true'
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - if: steps.scope.outputs.full == 'true'
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets --all-features

  # Compiles the renderer and the release-profile desktop executable (LTO,
  # single codegen unit) on the two platforms the release pipeline ships.
  # macOS delivery is deferred past 1.0 (ADR 0011); its code still compiles
  # and tests in the Rust matrix above. This does not launch a WebView or
  # validate packaging/signing.
  desktop-release-compile:
    name: Desktop release compile (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
          - platform: windows
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 45
    steps:
      # Same scope decision as the Rust checks: the release build runs in full
      # for release pull requests, pushes to main, and pull requests that
      # change native code or the dependency set.
      - name: Decide whether this run needs the full check
        id: scope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          PULL: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          ALWAYS: "false"
          PATTERN: '^(src-tauri/|package\.json$|pnpm-lock\.yaml$)'
        run: |
          if [ "$ALWAYS" = true ] || [ "$EVENT" != pull_request ] || [[ "$HEAD_REF" == release/* ]]; then
            full=true
          else
            # Read the list first: under pipefail, `grep -q` closing the pipe
            # early would turn a match into a failure and skip the check.
            files=$(gh api "repos/$REPO/pulls/$PULL/files" --paginate --jq '.[].filename')
            if grep -Eq "$PATTERN" <<<"$files"; then full=true; else full=false; fi
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "Full check: $full"
      - if: steps.scope.outputs.full == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Linux system dependencies
        if: steps.scope.outputs.full == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - if: steps.scope.outputs.full == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.17.0
      - if: steps.scope.outputs.full == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - if: steps.scope.outputs.full == 'true'
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - if: steps.scope.outputs.full == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - if: steps.scope.outputs.full == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.scope.outputs.full == 'true'
        run: pnpm tauri build --no-bundle
